# Consumer-visible changes require a VERSION bump (issue #1152).
#
# Anvil's installed surface (anvil/ + scripts/install-anvil.sh +
# scripts/resync-installed.sh) is copied into consumers' .anvil/ trees at
# install time and never refreshed by a git pull. VERSION is the only
# mechanical signal a consumer has that its copies are stale, so a PR that
# changes that surface must bump VERSION -- or say, explicitly, that it does
# not change installed behavior.
#
# Model copied from rjwalters/loom (loom#5874): VERSION on `main` IS the
# release. Tags and GitHub Releases stay manual and occasional; nothing in this
# workflow cuts, pushes, or requires one.
#
# Escape hatch: put the literal marker
#     <!-- loom:no-surface-change -->
# in the PR body or in a commit message on the PR. See CLAUDE.md §
# "Installed-surface VERSION discipline".
#
# Merge queue (#1523): the workflow also runs on `merge_group` events
# (types: [checks_requested]) so the gate reports on the combined queue tree
# when GitHub's merge queue requests checks. A merge_group event carries no
# pull_request object, so the gate is invoked with the merge-group's own
# base/head shas. The target branch (the --tip comparison's home) is read
# from the event payload itself (merge_group.base_ref, #1527); if that field
# is ever absent/empty, the resolve step exports the literal string `origin/`
# as the tip, and scripts/check-surface-version-bump.sh's tip-ref existence
# check (exit 2) fails the run loudly rather than --tip-ing a wrong ref
# (#1529). The commits
# API is consulted only for the queued PR's body (the marker's PR-body home),
# and if that association yields no PR the body degrades to empty with a
# ::warning:: — a group that bumped VERSION (or left the surface untouched)
# still evaluates, and a marker-relying group fails closed through the
# gate's normal verdict path (#1527). Nothing here changes pull_request-run
# behavior.
name: version-bump-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

# Merge-group runs are keyed by the combined tree's unique head SHA, so a
# queue entry can never be cancelled or superseded by a PR run (distinct
# keys) or by another merge-group entry (cancel-in-progress is false). PR
# runs fall through to per-head-sha keys, which is GitHub's default
# scheduling -- no cancellation, no serialization across PRs.
concurrency:
  group: version-bump-gate-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  # Merge-group runs read the queued PR's body through the commits API
  # (read-only); pull_request runs do not use it. The target branch is not
  # API-recovered (issue #1527) — it comes from the event payload.
  pull-requests: read

jobs:
  surface-version-bump:
    name: consumer-visible changes require a VERSION bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # The gate diffs two explicit shas. A shallow checkout can leave the
          # base sha unreachable, which the script reports as exit 2 (could not
          # evaluate) rather than a real verdict -- so fetch everything.
          # fetch-depth: 0 also fetches all branches, which the --tip
          # comparison (origin/<target branch>) relies on in both event modes.
          fetch-depth: 0
          # On merge_group events, pin the combined queue tree's head commit
          # explicitly (the event's head_sha) so the gate can never silently
          # evaluate anything but the tree the queue asked about. On
          # pull_request events this expression is empty and checkout keeps
          # its PR default, so PR behavior is unchanged.
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}

      - name: Resolve queued PR metadata (merge groups only)
        # The target branch comes from the event payload itself (#1527):
        # merge_group.base_ref is a full ref (refs/heads/<branch>) per GitHub's
        # documented payload, so it is stripped before building origin/<branch>.
        # Payload-shape caveat: not traced against a live merge_group event;
        # if the payload field is ever absent/empty this step still exports
        # GATE_TIP_REF=origin/ -- a non-empty string, so the :? expansion in
        # the gate step does NOT fire (GitHub Actions sets an empty env
        # expression to the empty string, but stripping refs/heads/ off a
        # missing base_ref leaves "origin/"). The real guard for that case is
        # scripts/check-surface-version-bump.sh's tip-ref existence check,
        # which exits 2 on "tip ref 'origin/' not found" and fails the run
        # loudly rather than --tip-ing a wrong ref; pinned by
        # test_origin_slash_tip_is_usage_error (#1529).
        # The commits API association (/commits/{sha}/pulls) is kept only for
        # the PR body (where the no-surface-change marker may live), so an
        # unverified association cannot red-line a group that does not rely on
        # the marker (#1527): on no/failed association the body degrades to
        # empty with a ::warning::, a group that bumped VERSION (or left the
        # surface untouched) still evaluates, and a marker-relying group fails
        # closed through the gate's normal verdict path (empty body finds no
        # marker).
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          BASE_REF="${MERGE_BASE_REF#refs/heads/}"
          echo "GATE_TIP_REF=origin/${BASE_REF}" >> "$GITHUB_ENV"
          # The queue's merge commit has the PR's head as its second parent, so
          # /commits/{sha}/pulls lists the queued PR(s). Any group member's
          # body may carry the marker (the target branch is shared by every
          # member; a merge queue is per base branch).
          PRS_JSON="$(gh api "repos/${{ github.repository }}/commits/${MERGE_HEAD_SHA}/pulls" 2>/dev/null)" || PRS_JSON=""
          PR_COUNT="$(jq 'length' <<<"$PRS_JSON" 2>/dev/null)" || PR_COUNT=0
          if [[ "$PR_COUNT" -eq 0 ]]; then
            echo "::warning::commits API returned no pull request for merge-group commit ${MERGE_HEAD_SHA}; the no-surface-change marker cannot be read from PR bodies (issue #1527). A group that relies on the marker will fail (empty body); a group that bumped VERSION or left the surface untouched is unaffected." >&2
            exit 0
          fi
          BODIES="$(jq -r '[.[].body // ""] | join("\n")' <<<"$PRS_JSON")"
          # The heredoc delimiter is randomized per run: a fixed delimiter is
          # repo-visible, so a PR body containing that literal line could close
          # the heredoc early and inject env into the gate step (harmless
          # today — the gate step already runs attacker-supplied code from the
          # combined tree — but cheap to close).
          DELIM="GATE_PR_BODY_EOF_$(openssl rand -hex 16)"
          {
            echo "GATE_PR_BODY<<$DELIM"
            printf '%s' "$BODIES"
            echo
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Check installed-surface change against VERSION
        env:
          EVENT_NAME: ${{ github.event_name }}
          # pull_request-mode inputs (all empty on merge_group events):
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          # merge_group-mode inputs (all empty on pull_request events; the
          # resolve step additionally exports GATE_PR_BODY + GATE_TIP_REF):
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          # The marker is read from the PR body by the script; the script
          # separately scans commit messages between base and head with no
          # extra plumbing. --tip (#1508): base.sha is the PR's merge point,
          # not the base branch's tip at merge time, so a sibling PR that
          # bumped VERSION on main after this branched is invisible to --base
          # alone. --tip makes the script also require a VERSION strictly
          # newer than main's.
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE_SHA" HEAD_ARG="$PR_HEAD_SHA"
              TIP="origin/$BASE_REF" BODY="$PR_BODY" ;;
            merge_group)
              BASE="$MERGE_BASE_SHA" HEAD_ARG="$MERGE_HEAD_SHA"
              TIP="${GATE_TIP_REF:?GATE_TIP_REF missing; the resolve step must have run}" BODY="${GATE_PR_BODY:-}" ;;
            *)
              echo "::error::unsupported event: $EVENT_NAME" >&2
              exit 1 ;;
          esac
          PR_BODY="$BODY" ./scripts/check-surface-version-bump.sh \
            --base "$BASE" \
            --head "$HEAD_ARG" \
            --tip "$TIP"

      - name: Check version files are in sync
        # Guards the other half of the same signal: a hand-edited VERSION that
        # leaves CLAUDE.md / pyproject.toml / README.md behind makes downstream
        # "am I current?" reads disagree with each other. `version.sh bump`
        # keeps all four in step; this asserts the result.
        run: ./scripts/version.sh check
